<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groovebox</title>
  
  <!-- Blueprint CSS dependencies -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/jpeg" href="favicon.jpg">
  <link href="https://unpkg.com/normalize.css@8.0.1/normalize.css" rel="stylesheet" />
  <link href="https://unpkg.com/@blueprintjs/core@5/lib/css/blueprint.css" rel="stylesheet" />
  <link href="https://unpkg.com/@blueprintjs/icons@5/lib/css/blueprint-icons.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body class="bp5-dark">
  <div class="app-layout">
    <!-- Blueprint Navbar Header -->
    <nav class="bp5-navbar bp5-dark navbar-custom">
      <div class="bp5-navbar-group bp5-align-left">
        <button class="bp5-button bp5-minimal bp5-icon-menu sidebar-toggle-btn" id="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Playlists Sidebar"></button>
        <div class="bp5-navbar-heading brand-title">
          <svg class="custom-navbar-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9.5"></circle>
            <circle cx="12" cy="12" r="7" stroke-dasharray="2 2" opacity="0.6"></circle>
            <circle cx="12" cy="12" r="3.2" fill="#2b95d6"></circle>
            <circle cx="12" cy="12" r="1" fill="#111418"></circle>
          </svg>
          Groovebox
        </div>
      </div>

      <div class="bp5-navbar-group bp5-align-right search-container">
        <div class="bp5-input-group bp5-round">
          <span class="bp5-icon bp5-icon-search"></span>
          <input type="text" class="bp5-input" id="search-input" placeholder="Search tracks, artists, albums..." oninput="handleSearch(this.value)" />
        </div>
        <div class="sync-banner-wrap" id="sync-banner-wrap" style="display: none;">
          <div class="sync-spinner bp5-spinner bp5-small bp5-intent-primary"><div class="bp5-spinner-head"></div></div>
          <span class="sync-status-text" id="sync-status-text">Syncing Discogs...</span>
        </div>
        <div class="settings-menu-wrap">
          <button class="bp5-button bp5-minimal bp5-icon-cog settings-gear-btn" id="settings-gear-btn" onclick="toggleSettingsMenu(event)" title="Settings & Sync"></button>
          <div class="bp5-menu bp5-elevation-2 settings-dropdown-menu" id="settings-dropdown-menu" style="display: none;">
            <a class="bp5-menu-item bp5-icon-refresh" id="discogs-sync-btn" onclick="triggerDiscogsSync()">Sync Discogs (Collection & Wantlist)</a>
            <div class="sync-last-time" id="sync-last-time"></div>
          </div>
        </div>
      </div>
    </nav>

    <!-- App Body: Sidebar + Main Area -->
    <div class="app-body">
      <!-- Sidebar -->
      <aside class="sidebar-panel" id="sidebar-panel">
        <div class="sidebar-header">
          <h5 class="bp5-heading text-muted">LIBRARY</h5>
        </div>
        <div class="bp5-menu library-menu">
          <a class="bp5-menu-item nav-item-btn" id="nav-all-songs" onclick="showAllSongs()">
            <span class="bp5-icon-standard bp5-icon-music"></span>
            <span class="nav-item-text">All Songs</span>
          </a>
          <a class="bp5-menu-item nav-item-btn" id="nav-artists" onclick="showArtists()">
            <span class="bp5-icon-standard bp5-icon-user"></span>
            <span class="nav-item-text">Artists</span>
          </a>
          <a class="bp5-menu-item nav-item-btn" id="nav-albums" onclick="showAlbums()">
            <svg class="custom-sidebar-icon vinyl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9.5"></circle>
              <circle cx="12" cy="12" r="7" stroke-dasharray="2 2" opacity="0.6"></circle>
              <circle cx="12" cy="12" r="3.2" fill="currentColor"></circle>
              <circle cx="12" cy="12" r="1" fill="#181d24"></circle>
            </svg>
            <span class="nav-item-text">Albums</span>
          </a>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-header">
          <h5 class="bp5-heading text-muted">PLAYLISTS</h5>
          <div class="sidebar-header-actions">
            <div class="bp5-select bp5-minimal bp5-small">
              <select id="playlist-sort-select" onchange="handleSortChange(this.value)" title="Sort Playlists">
                <option value="name_asc">Name (A-Z)</option>
                <option value="name_desc">Name (Z-A)</option>
                <option value="date_desc" selected>Newest First</option>
                <option value="date_asc">Oldest First</option>
              </select>
            </div>
            <button class="bp5-button bp5-minimal bp5-small bp5-icon-double-chevron-left collapse-btn" onclick="toggleSidebar()" title="Collapse sidebar"></button>
          </div>
        </div>
        <div class="bp5-menu playlist-menu" id="sidebar-playlists">
          <!-- Dynamically populated -->
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-panel">
        <!-- Section Local Filter Search Bar & Segmented Pills -->
        <div class="section-filter-wrap" id="section-filter-wrap" style="display: none;">
          <div class="section-filter-inner">
            <!-- Segmented Filter Pills (Visible when in Albums View) -->
            <div class="bp5-button-group bp5-large album-filter-pills" id="album-filter-pills" style="display: none;">
              <button class="bp5-button bp5-active" id="pill-all" onclick="setAlbumFilter('all')">
                All Albums <span class="bp5-tag bp5-round bp5-minimal count-tag" id="count-all">-</span>
              </button>
              <button class="bp5-button" id="pill-collection" onclick="setAlbumFilter('collection')">
                📀 Collection <span class="bp5-tag bp5-round bp5-intent-warning count-tag" id="count-collection">-</span>
              </button>
              <button class="bp5-button" id="pill-wantlist" onclick="setAlbumFilter('wantlist')">
                🎯 Wantlist <span class="bp5-tag bp5-round bp5-intent-primary count-tag" id="count-wantlist">-</span>
              </button>
            </div>

            <div class="bp5-input-group bp5-round full-width-filter">
              <span class="bp5-icon bp5-icon-filter"></span>
              <input type="text" class="bp5-input" id="section-filter-input" placeholder="Filter current view..." oninput="handleSectionFilter(this.value)" />
            </div>
          </div>
        </div>

        <!-- Dedicated Album Detail Page View -->
        <div class="album-detail-view" id="album-detail-container" style="display: none;">
          <!-- Dynamically rendered -->
        </div>

        <!-- Dedicated Artist Detail Page View -->
        <div class="artist-detail-view" id="artist-detail-container" style="display: none;">
          <!-- Dynamically rendered -->
        </div>

        <!-- Grid View Container (for Artists & Albums) -->
        <div class="grid-container" id="grid-container" style="display: none;">
          <!-- Dynamically populated cards -->
        </div>

        <!-- Blueprint HTML Table (for Track Lists) -->
        <div class="table-container bp5-card bp5-elevation-1" id="table-container">
          <table class="bp5-html-table bp5-html-table-striped bp5-interactive bp5-compact full-width-table">
            <thead>
              <tr>
                <th style="width: 50px;">#</th>
                <th>Track / Artist</th>
                <th>Album</th>
                <th style="width: 100px;">Duration</th>
                <th style="width: 100px; text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="tracklist-body">
              <!-- Tracks rendered here -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
